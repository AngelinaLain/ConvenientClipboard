# Optional: let the Docker daemon mount a real NFS v4 export.
services:
  backend:
    volumes:
      - nfs_storage:/mnt/remote/nfs
volumes:
  nfs_storage:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER:?Set NFS server address},nfsvers=4,rw"
      device: ":${NFS_EXPORT:?Set NFS export path}"
