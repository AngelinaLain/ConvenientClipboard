name: convenient-clipboard
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipboard
      POSTGRES_USER: clipboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U clipboard -d clipboard"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-env first}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/clipboard
      SPRING_DATASOURCE_USERNAME: clipboard
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init-env first}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/init-env first}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:8088}
      APP_STORAGE_PATH: /data/files
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:-admin}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Run scripts/init-env first}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Run scripts/init-env first}
      APP_STORAGE_ENCRYPTION_KEY: ${APP_STORAGE_ENCRYPTION_KEY:?Run scripts/init-env first}
      APP_MOUNTED_STORAGE_ROOT: /mnt/remote
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-1073741824}
    volumes:
      - file_data:/data/files
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8088}:80"
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 5
volumes:
  postgres_data:
  redis_data:
  file_data:
